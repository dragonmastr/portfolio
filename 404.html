<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Hardik Murdia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300&display=swap" rel="stylesheet">
<style>
:root {
	--ink: #131A24;
	--slate: #5D6E7C;
	--paper: #DCE2E4;
	--card: #F1F4F4;
	--line: #B9C3C6;
	--signal: #005E52;
	--signal-soft: #C7DAD5;
	--alert: #A62030;
	--pad: clamp(1.25rem, 5vw, 5.5rem);
	--rail: 12.5rem;
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Newsreader", Georgia, serif;
	--mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

body {
	margin: 0;
	min-height: 100vh;
	display: grid;
	place-items: center;
	background: var(--paper);
	color: var(--ink);
	font-family: var(--body);
	padding: 2rem;
	text-align: center;
}

.code {
	font-family: var(--mono);
	font-size: 0.72rem;
	letter-spacing: 0.1em;
	text-transform: uppercase;
	color: var(--alert);
}

h1 {
	font-family: var(--display);
	font-weight: 800;
	font-size: clamp(2.5rem, 9vw, 5rem);
	letter-spacing: -0.03em;
	line-height: 1;
	margin: 1rem 0 0;
}

p { font-weight: 300; font-size: 1.1rem; max-width: 34ch; margin: 1.25rem auto 0; }

a {
	display: inline-block;
	margin-top: 2rem;
	padding: 0.6rem 1.1rem;
	background: var(--signal);
	color: var(--card);
	text-decoration: none;
	font-family: var(--mono);
	font-size: 0.72rem;
	letter-spacing: 0.08em;
	text-transform: uppercase;
}

a:hover { background: var(--ink); }
</style>
</head>
<body>
<main>
	<span class="code">404 · span not found</span>
	<h1>No trace here</h1>
	<p>This path never emitted anything. The page you wanted may have moved.</p>
	<a href="/">Back to the start</a>
</main>
</body>
</html>
